name: snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo este job: la accion de deploy pushea a la rama output
    steps:
      # acciones de terceros pinneadas a SHA (supply-chain)
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake
        with:
          github_user_name: callofthev0id
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=5a92c9&color_dots=11161f,1f2733,5a92c9,5fae87,d65a63
            dist/snake-dark.svg?palette=github-dark&color_snake=5a92c9&color_dots=0b0e14,1f2733,5a92c9,5fae87,d65a63
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
