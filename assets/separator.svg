<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 46" width="900" height="46" font-family="ui-monospace,'JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="ll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a92c9" stop-opacity="0"/>
      <stop offset="70%" stop-color="#5a92c9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a92c9" stop-opacity="0.85"/>
